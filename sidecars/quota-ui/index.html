<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quota Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <!-- ── Top Bar ─────────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-title">Quota Dashboard</span>
      <div class="topbar-status">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-label" id="status-label">Connecting…</span>
        <span class="rpc-warn" id="rpc-warn" style="display:none" title="Live data unavailable — showing cached snapshot">Stale</span>
      </div>
    </div>
    <div class="topbar-center">
      <span id="health-pills" class="health-pills"></span>
    </div>
    <div class="topbar-right">
      <button class="refresh-btn" id="refresh-btn" title="Refresh now (R)" aria-label="Refresh">
        <svg viewBox="0 0 16 16" fill="none" width="12" height="12">
          <path d="M13.5 8A5.5 5.5 0 1 1 8 2.5c1.8 0 3.4.87 4.4 2.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M11 2l1.5 2.7L15 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 16 16" fill="none">
          <circle cx="6.5" cy="6.5" r="4" stroke="currentColor" stroke-width="1.2"/>
          <path d="M10 10l3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <input
          id="search"
          class="search-input"
          type="text"
          placeholder="Filter accounts… (⌘K)"
          autocomplete="off"
          spellcheck="false"
        >
        <button class="search-clear" id="search-clear" style="display:none" aria-label="Clear filter">✕</button>
      </div>
    </div>
  </header>

  <!-- ── Error Banner ─────────────────────────────────────────────── -->
  <div id="error-banner"></div>

  <!-- ── Model Groups ─────────────────────────────────────────────── -->
  <main class="groups-wrap" id="cards"></main>

  <!-- ── Footer ──────────────────────────────────────────────────── -->
  <footer class="foot" id="footer">
    <span class="foot-safe">🔒 Read-only · 127.0.0.1 · Official App RPC</span>
    <span class="foot-ts" id="ts"></span>
  </footer>

  <!-- ── Drawer ──────────────────────────────────────────────────── -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-modal="true" role="dialog">
    <div class="drawer-header">
      <div class="drawer-title" id="drawer-title">Account Detail</div>
      <button class="drawer-close" id="drawer-close" aria-label="Close">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <script src="/app.js"></script>
</body>
</html>

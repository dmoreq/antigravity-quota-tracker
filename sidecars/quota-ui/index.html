<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quota Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <!-- ── Top Bar ─────────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-title">Quota Dashboard</span>
      <div class="topbar-status" id="refresh-status">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-label" id="status-label">Connecting…</span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 16 16" fill="none">
          <circle cx="6.5" cy="6.5" r="4" stroke="currentColor" stroke-width="1.2"/>
          <path d="M10 10l3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <input
          id="search"
          class="search-input"
          type="text"
          placeholder="Filter accounts… (⌘K)"
          autocomplete="off"
          spellcheck="false"
        >
      </div>
    </div>
  </header>

  <!-- ── Error Banner ─────────────────────────────────────────────── -->
  <div id="error-banner"></div>

  <!-- ── Aggregate Summary Strip ─────────────────────────────────── -->
  <section class="summary-strip" id="summary-strip">
    <div class="summary-stat">
      <span class="stat-value" id="sum-total">—</span>
      <span class="stat-label">Accounts</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-stat">
      <span class="stat-value" id="sum-active">—</span>
      <span class="stat-label">Active Now</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-stat">
      <span class="stat-value" id="sum-ready">—</span>
      <span class="stat-label">Ready to Switch</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-stat">
      <span class="stat-value stat-warn" id="sum-low">—</span>
      <span class="stat-label">Low</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-stat">
      <span class="stat-value stat-crit" id="sum-exhausted">—</span>
      <span class="stat-label">Depleted</span>
    </div>
  </section>

  <!-- ── Model Groups ─────────────────────────────────────────────── -->
  <main class="groups-wrap" id="cards">
    <div class="row-loading">Connecting to Antigravity…</div>
  </main>

  <!-- ── Footer ──────────────────────────────────────────────────── -->
  <footer class="foot" id="footer">
    <span class="foot-safe">🔒 Read-only · 127.0.0.1 · Official App RPC</span>
    <span class="foot-ts" id="ts"></span>
  </footer>

  <!-- ── Drawer ──────────────────────────────────────────────────── -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-header">
      <div class="drawer-title" id="drawer-title">Account Detail</div>
      <button class="drawer-close" id="drawer-close" aria-label="Close">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <script src="/app.js"></script>
</body>
</html>

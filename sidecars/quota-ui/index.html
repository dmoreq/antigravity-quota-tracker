<!DOCTYPE html>
<html lang="en" data-theme="one-dark-pro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quota Dashboard</title>
  <script>
    try {
      var s = localStorage.getItem('agy_theme');
      if (s) document.documentElement.setAttribute('data-theme', s);
    } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <!-- ── Top Bar: Title, Status, Search & Refresh ───────────────────── -->
  <header class="topbar">
    <div class="topbar-left">
      <svg class="topbar-logo" viewBox="0 0 32 32" width="18" height="18" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#0D1117" />
        <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#30363D" />
        <path d="M7.5 22.5A11 1 0 1 1 24.5 22.5" stroke="#A855F7" stroke-width="2" stroke-linecap="round" />
        <path d="M9.8 20.8A8.2 8.2 0 1 1 22.2 20.8" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
        <path d="M12.2 19A5.4 5.4 0 1 1 19.8 19" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
        <circle cx="16" cy="16.5" r="1.8" fill="#F0F6FC" />
        <path d="M16 16.5L19.2 13.3" stroke="#F0F6FC" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="20.5" cy="11.5" r="1.5" fill="#10B981" />
      </svg>
      <span class="topbar-title">Quota</span>
      <div class="status-wrap">
        <span class="status-dot" id="status-dot" aria-hidden="true"></span>
        <span class="status-text" id="status-label">Connecting…</span>
        <span class="rpc-badge" id="rpc-warn" style="display:none">Cached</span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="search-wrap">
        <svg class="search-glyph" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
          <circle cx="6.5" cy="6.5" r="4"/>
          <path d="M9.5 9.5l3.5 3.5" stroke-linecap="round"/>
        </svg>
        <input
          id="search"
          class="search-input"
          type="text"
          placeholder="Filter (⌘K)"
          autocomplete="off"
          spellcheck="false"
          aria-label="Filter accounts"
        >
        <button id="search-clear" class="btn-clear" style="display:none" aria-label="Clear filter">✕</button>
      </div>
      <button id="refresh-btn" class="btn-icon" title="Refresh (R)" aria-label="Refresh data">
        <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
          <path d="M13.5 8A5.5 5.5 0 1 1 8 2.5c1.8 0 3.4.87 4.4 2.2" stroke-linecap="round"/>
          <path d="M11 2l1.5 2.7L15 3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── Sub Bar: Model Filters & Health Summary ─────────────────────── -->
  <nav class="subbar" aria-label="Model switcher and quota summary">
    <div class="model-tabs" role="group" aria-label="Filter models" id="model-tabs">
      <button class="tab-btn active" type="button" aria-pressed="true" data-model="gemini">Gemini</button>
      <button class="tab-btn active" type="button" aria-pressed="true" data-model="argon">Argon</button>
      <button class="tab-btn" type="button" aria-pressed="false" data-model="claude">Claude</button>
    </div>
    <div class="health-summary" id="health-pills" aria-live="polite"></div>
  </nav>

  <!-- ── Error / Alert Banner ───────────────────────────────────────── -->
  <div id="error-banner"></div>

  <!-- ── Main Canvas (Borderless Open Layout) ───────────────────────── -->
  <main class="main-canvas" id="cards" role="tabpanel" tabindex="-1" aria-label="Quota accounts"></main>

  <!-- ── Footer ────────────────────────────────────────────────────── -->
  <footer class="foot" id="footer">
    <span class="foot-safe">127.0.0.1 · Read-only RPC</span>
    <div class="foot-right">
      <span class="foot-theme" id="theme-badge" title="Theme synchronized with Antigravity">One Dark Pro</span>
      <span class="foot-ts" id="ts"></span>
    </div>
  </footer>

  <!-- ── Drawer Detail ─────────────────────────────────────────────── -->
  <div class="drawer-overlay" id="drawer-overlay" tabindex="-1"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-modal="true" role="dialog" aria-labelledby="drawer-title">
    <div class="drawer-header">
      <h2 class="drawer-title" id="drawer-title">Account Detail</h2>
      <button class="drawer-close" id="drawer-close" aria-label="Close detail">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <script src="/app.js"></script>
</body>
</html>
